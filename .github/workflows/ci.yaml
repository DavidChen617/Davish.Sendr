name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: >
          dotnet test -c Release --no-build
          --report-xunit-trx --report-xunit-ctrf
          --results-directory TestResults

      - name: JustBdd report
        if: always()
        run: dotnet justbdd html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
