name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: |
          for proj in \
            src/Sendr.Abstractions/Sendr.Abstractions.csproj \
            src/Sendr/Sendr.csproj \
            src/Sendr.Notification.Abstractions/Sendr.Notification.Abstractions.csproj \
            src/Sendr.Notification/Sendr.Notification.csproj \
            src/Sendr.Message/Sendr.Message.csproj; do
            dotnet pack "$proj" -c Release -o out
          done

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
